version: 1
description: >
  Colocated serving baseline for attention-FFN disaggregation (AFD) study.
  Qwen3-30B-A3B served by vLLM with the vllm-torchtpu plugin, attention and
  experts on the same chips, layout tp8_ep. Trace covers one profiled
  `vllm bench serve` run: random dataset, 16 concurrent requests,
  32 prompts, 1024 input / 256 output tokens, after the measured
  (unprofiled) sweep. CS 5470 Team 27.
hf_url: https://huggingface.co/Qwen/Qwen3-30B-A3B
trace_url: gs://cs5470-fa26-team27-data/colocated/runs/20261105-134448-charlie-spot-asia-south1-c/profile/tp8_ep/
contributor: Charlie Xue
contact: cx267@cornell.edu

workload:
  model:
    phase: inference
    moe: true
    granularity: model_fwd
    model_family: qwen3-30b-a3b
    precision: bf16
    epochs: 1
    iteration: 32  # requests in the profiled window
    model_arch:
      num_params: 30532122624
      num_params_embedding: 311164928  # vocab 151936 * hidden 2048
      num_layers: 48
      num_heads: 32
      head_dim: 128
  data:
    batch_size: 16  # max concurrent requests
    seq_len: 1280
    input_len: 1024
    output_len: 256
    dataset: random
  hardware:
    network_topo:
      topology: torus_2d  # single v6e host, chips joined by ICI
      bandwidth_gbps:
        - 0    # no scale-out traffic: single host
        - 800  # ICI, 100 GB/s unidirectional per link
    xpu_spec:
      type: TPU
      model: tpu_v6e
      total_count: 8
      count_per_node: 8
    driver_version: libtpu_0.0.50

Model-executor:
  framework:
    name: vllm  # vllm 0.32.0+empty + vllm-torchtpu v0.32.0
    compiler_tool_selection: xla  # torch_tpu, torch.compile(backend="tpu")
  model_plan_parallelization:
    dp_replicate: 1
    dp_shard: 1
    tp: 8
    pp: 1
    cp: 1
    ep: 8
    pp_mb: 1
  communication_library:
    name: xla
    version: libtpu_0.0.50
    env: {}
  protocol_selection:
    - ici

metric_source:
  traces:
    - json   # rank_<N>/*.pt.trace.json.gz (Chrome trace format)
    - xplane # plugins/profile/<timestamp>/rank<N>_*.xplane.pb
  metrics_specific_trace: []
